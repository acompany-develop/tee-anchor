{
  // 参考用 QCNL 設定（Azure Confidential VM 想定。Humane-RAFW-MAA 由来）。
  // sgx_qe_get_quote が PCK 証明書チェーン(cert key type 5)を Quote に埋め込むには、
  // QCNL が PCK collateral を取得できる必要がある。
  // 実機では通常 /etc/sgx_default_qcnl.conf に配置する。環境に合わせて編集すること。
  // *** ATTENTION : JSON のキーは case sensitive。変更しないこと。

  "pccs_url": "https://global.acccache.azure.net/sgx/certification/v4/",
  "use_secure_cert": true,
  "collateral_service": "https://api.trustedservices.intel.com/sgx/certification/v4/",
  "pccs_api_version": "3.1",
  "retry_times": 6,
  "retry_delay": 5,
  "local_pck_url": "http://169.254.169.254/metadata/THIM/sgx/certification/v4/",
  "pck_cache_expire_hours": 48,
  "verify_collateral_cache_expire_hours": 48,
  "custom_request_options": {
    "get_cert": {
      "headers": { "metadata": "true" },
      "params": { "api-version": "2021-07-22-preview" }
    }
  }
}
